<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Apprendre et réviser l'examen civique à partir du Livret du citoyen 2026 : cartes, défis et quiz.">
<meta name="theme-color" content="#2846b5">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Quiz du Citoyen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout : une "copie d'examen" centrée (max 720px), un écran à la fois — accueil, question, correction. Tampon de préfecture au résultat. */
:root{
  --paper:#f4f5fa; --card:#ffffff; --ink:#15204a; --muted:#5b6386; --line:#dde1ee;
  --bleu:#2846b5; --bleu-soft:#e7ecfb; --rouge:#d9303f; --rouge-soft:#fbe9eb;
  --vert:#1c8657; --vert-soft:#e3f4ec; --ombre:0 1px 2px rgba(21,32,74,.06),0 8px 24px rgba(21,32,74,.06);
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1430; --card:#171e42; --ink:#eef0fa; --muted:#a5abcb; --line:#2a335f;
  --bleu:#7f9bff; --bleu-soft:#232d63; --rouge:#ff6b77; --rouge-soft:#3a1d2a;
  --vert:#4fd39a; --vert-soft:#16352c; --ombre:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1430; --card:#171e42; --ink:#eef0fa; --muted:#a5abcb; --line:#2a335f;
  --bleu:#7f9bff; --bleu-soft:#232d63; --rouge:#ff6b77; --rouge-soft:#3a1d2a;
  --vert:#4fd39a; --vert-soft:#16352c; --ombre:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.tricolore{height:5px;display:flex;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.tricolore i{flex:1}.tricolore i:nth-child(1){background:#2846b5}.tricolore i:nth-child(2){background:#fff;border-block:1px solid var(--line)}.tricolore i:nth-child(3){background:#d9303f}
main{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--bleu);outline-offset:2px}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--muted)}

/* Accueil */
.hero{padding-block:36px 20px;display:grid;gap:12px}
.hero h1{font-size:clamp(2.1rem,7vw,3.3rem);font-weight:800;line-height:1.02}
.hero h1 em{font-style:normal;color:var(--bleu)}
.hero p{margin:0;color:var(--muted);max-width:56ch}
.exam{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--bleu);color:#fff;border-radius:18px;padding:22px;border:0;text-align:left;width:100%;transition:transform .15s}
.exam:hover{transform:translateY(-2px)}
.exam h2{font-size:1.45rem;color:#fff}
.exam p{margin:4px 0 0;opacity:.88;font-size:.95rem}
.exam .go{font-family:var(--f-display);font-weight:800;font-size:1.6rem;background:rgba(255,255,255,.16);width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.exam .best{display:inline-block;margin-top:10px;font-size:.82rem;background:rgba(255,255,255,.18);padding:2px 10px;border-radius:99px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:32px 0 12px}
.section-title h2{font-size:1.25rem}
.len{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px}
.len button{border:0;background:transparent;padding:4px 12px;border-radius:99px;font-weight:700;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.len button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.part{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:grid;gap:6px;align-content:start;transition:border-color .15s,transform .15s}
.part:hover{border-color:var(--bleu);transform:translateY(-2px)}
.part .num{font-family:var(--f-display);font-weight:800;font-size:.85rem;color:var(--bleu)}
.part h3{font-size:1.08rem;line-height:1.2}
.part .meta{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.part .meta b{color:var(--vert)}
.note{margin-top:28px;font-size:.88rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px}

/* Question */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:14px 10px;display:grid;gap:10px}
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.quit{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;font-size:.88rem;font-weight:700}
.count{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:.92rem}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bleu),var(--bleu) 70%,var(--rouge));border-radius:99px;transition:width .35s ease}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,30px);box-shadow:var(--ombre);margin-top:8px;display:grid;gap:20px;animation:in .3s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.qtag{display:inline-flex;gap:8px;align-items:center;font-size:.8rem;font-weight:700;color:var(--bleu);background:var(--bleu-soft);padding:3px 10px;border-radius:99px;justify-self:start}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(1.25rem,4.2vw,1.6rem);line-height:1.22}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--bleu)}
.opt .k{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.opt[aria-checked="true"]{border-color:var(--bleu);background:var(--bleu-soft)}
.opt[aria-checked="true"] .k{background:var(--bleu);color:#fff;border-color:var(--bleu)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hint{font-size:.85rem;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 22px;font-weight:700;font-family:var(--f-display);font-size:1.02rem;background:var(--ink);color:var(--paper);transition:opacity .15s,transform .15s}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:not(:disabled):hover{transform:translateY(-1px)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.blue{background:var(--bleu);color:#fff}

/* Résultats */
.result{padding-block:28px 8px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
@media (max-width:520px){.result{grid-template-columns:1fr;justify-items:start}}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:2.3rem;font-variant-numeric:tabular-nums;line-height:1}
.ring .val small{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin-top:4px}
.verdict h2{font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.08}
.verdict p{margin:8px 0 0;color:var(--muted)}
.stamp{display:inline-block;margin-top:12px;font-family:var(--f-display);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:1.05rem;padding:6px 14px;border:3px solid currentColor;border-radius:8px;transform:rotate(-6deg);opacity:.92}
.stamp.ok{color:var(--vert)}.stamp.ko{color:var(--rouge)}
@media (prefers-reduced-motion:no-preference){.stamp{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) .3s both}}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.4);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:.92}}
.res-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.filter{display:flex;gap:6px;margin:28px 0 12px;flex-wrap:wrap;align-items:center}
.filter h2{font-size:1.25rem;margin-right:auto}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;font-weight:700;font-size:.88rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.corr{display:grid;gap:12px}
.ci{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--vert);border-radius:14px;padding:16px 18px;display:grid;gap:10px}
.ci.wrong{border-left-color:var(--rouge)}
.ci-head{display:flex;gap:10px;align-items:baseline}
.ci-n{font-family:var(--f-display);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;min-width:2ch}
.ci-q{font-weight:700;min-width:0}
.ans{display:grid;gap:6px;font-size:.95rem}
.ans div{padding:7px 12px;border-radius:10px;display:flex;gap:8px;align-items:baseline}
.ans .good{background:var(--vert-soft)}.ans .good b{color:var(--vert)}
.ans .bad{background:var(--rouge-soft)}.ans .bad b{color:var(--rouge)}
.expl{font-size:.92rem;color:var(--muted);margin:0}
.expl .pg{font-weight:700;color:var(--bleu);white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:24px}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}

/* Apprendre */
.me{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:stretch}
@media (max-width:560px){.me{grid-template-columns:1fr 1fr}.me .lvl{grid-column:1/-1}}
.me>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:6px;align-content:center}
.lvl strong{font-family:var(--f-display);font-size:1.25rem;line-height:1.1}
.xpbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--bleu),var(--rouge));border-radius:99px;transition:width .6s ease}
.small{font-size:.83rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stat{text-align:center;min-width:110px}
.stat b{font-family:var(--f-display);font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center;justify-content:center}
.stat svg{width:22px;height:22px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:22px}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;font-family:var(--f-display);font-weight:700;font-size:1.02rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.path{margin-top:22px}
.path-head{display:flex;gap:10px;align-items:baseline;margin-bottom:10px;flex-wrap:wrap}
.path-head .num{font-family:var(--f-display);font-weight:800;font-size:.85rem;color:var(--bleu)}
.path-head h3{font-size:1.08rem}
.path-head .small{margin-left:auto}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.node{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:grid;gap:6px;align-content:start;position:relative;transition:transform .15s,border-color .15s}
.node:hover{transform:translateY(-2px);border-color:var(--bleu)}
.node .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--paper);border:2px solid var(--line);color:var(--muted)}
.node.done .dot{background:var(--bleu);border-color:var(--bleu);color:#fff}
.node.next{border-color:var(--bleu);box-shadow:0 0 0 3px var(--bleu-soft)}
.node.next::after{content:"À toi !";position:absolute;top:10px;right:10px;font-size:.72rem;font-weight:700;background:var(--rouge);color:#fff;padding:2px 8px;border-radius:99px}
@media (prefers-reduced-motion:no-preference){.node.next .dot{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--bleu-soft)}}
.node .nt{font-weight:700;font-size:.95rem;line-height:1.25}
.stars{letter-spacing:2px;color:var(--line);font-size:1rem}
.stars .on{color:var(--or,#e3a21a)}
.flip{perspective:1400px;cursor:pointer;margin-top:8px;outline:none}
.flip:focus-visible .face{outline:3px solid var(--bleu);outline-offset:2px}
.flip-inner{display:grid;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
@media (prefers-reduced-motion:reduce){.flip-inner{transition:none}}
.flipped .flip-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--ombre);padding:clamp(22px,5vw,36px);min-height:300px;display:grid;align-content:center;gap:16px}
.front{background:linear-gradient(160deg,var(--card) 60%,var(--bleu-soft))}
.front .prompt{font-family:var(--f-display);font-weight:700;font-size:clamp(1.4rem,5vw,1.9rem);line-height:1.2;margin:0;text-wrap:balance}
.tap{font-size:.88rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.tap::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid var(--bleu);display:inline-block}
.back{transform:rotateY(180deg)}
.hook{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,7vw,2.8rem);line-height:1.05;color:var(--bleu);text-wrap:balance}
.back p{margin:0;font-size:1.05rem}
.tip{background:var(--bleu-soft);border-radius:12px;padding:10px 14px;font-size:.95rem}
.tip b{color:var(--bleu);margin-right:6px}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.card-actions .btn{padding:14px}
.pop{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-family:var(--f-display);font-weight:800;font-size:2rem;color:var(--vert);pointer-events:none;z-index:40;animation:pop .9s ease-out forwards}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}to{opacity:0;transform:translate(-50%,-50px) scale(1)}}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,30px);box-shadow:var(--ombre);margin-top:8px;display:grid;gap:18px;animation:in .3s ease}
.lcard .opt.is-good{border-color:var(--vert);background:var(--vert-soft)}
.lcard .opt.is-good .k{background:var(--vert);border-color:var(--vert);color:#fff}
.lcard .opt.is-bad{border-color:var(--rouge);background:var(--rouge-soft)}
.lcard .opt.is-bad .k{background:var(--rouge);border-color:var(--rouge);color:#fff}
.lcard .opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;font-size:.95rem}
.fb.ok{background:var(--vert-soft)}.fb.ko{background:var(--rouge-soft)}
.fb b{display:block;font-family:var(--f-display);font-size:1.05rem;margin-bottom:2px}
.end{text-align:center;padding-block:34px 10px;display:grid;gap:12px;justify-items:center}
.bigstars{display:flex;gap:10px;font-size:3.4rem;line-height:1}
.bigstars span{color:var(--line)}
.bigstars span.on{color:#e3a21a}
@media (prefers-reduced-motion:no-preference){.bigstars span.on{animation:star .5s cubic-bezier(.2,1.8,.4,1) both}.bigstars span:nth-child(2){animation-delay:.2s}.bigstars span:nth-child(3){animation-delay:.4s}}
@keyframes star{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.end h2{font-size:clamp(1.6rem,5vw,2.1rem)}
.end-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.end-stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-width:120px}
.end-stats b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.levelup{background:var(--bleu);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700}
.end .xpwrap{width:min(100%,420px);display:grid;gap:6px;text-align:left}
</style>

</head>
<body>
<div class="tricolore" aria-hidden="true"><i></i><i></i><i></i></div>
<main id="app"></main>
<canvas id="confetti" hidden></canvas>

<script>
// [partie, page, question, bonne réponse, [mauvaises], explication]
const Q = [
// ───── PARTIE 1 : Principes et valeurs
[1,6,"Quelle est la devise de la République française ?","Liberté, égalité, fraternité",["Travail, famille, patrie","Unie dans la diversité","Paix, justice, solidarité"],"La devise est inscrite sur le fronton des bâtiments publics comme les mairies et les préfectures."],
[1,6,"Selon l'article 4 de la DDHC de 1789, en quoi consiste la liberté ?","Pouvoir faire tout ce qui ne nuit pas à autrui",["Pouvoir faire tout ce que l'on veut","Obéir uniquement à sa conscience","Ne dépendre d'aucune loi"],"On peut faire tout ce qui ne gêne pas les autres, dans les limites définies par la loi."],
[1,6,"Depuis quand l'égalité entre les femmes et les hommes est-elle inscrite dans le préambule de la Constitution ?","1946",["1789","1905","1981"],"Elle figure dans le préambule depuis 1946 et s'applique dans tous les domaines : travail, santé, éducation…"],
[1,6,"Qu'est-ce qu'une discrimination ?","Traiter différemment une personne, dans une situation comparable, en raison de son origine, sexe, religion…",["Choisir un candidat pour ses compétences","Refuser un service pour une raison de sécurité","Exprimer une opinion politique"],"Les discriminations (logement, travail, loisirs…) sont punies par la loi."],
[1,7,"Une décision d'embauche ou de promotion doit être fondée sur…","des raisons professionnelles",["des raisons personnelles","l'origine du candidat","les convictions religieuses du candidat"],"Toute décision d'un employeur doit reposer sur des critères professionnels, jamais personnels."],
[1,7,"Qu'est-ce que l'antisémitisme ?","Une forme de racisme et de haine dirigée contre les Juifs",["La critique d'un gouvernement étranger","Un refus de toutes les religions","Une discrimination fondée sur l'âge"],"L'État lutte activement contre le sexisme, le racisme, l'antisémitisme, les discriminations religieuses et anti-LGBT+."],
[1,7,"La fraternité républicaine repose sur…","la capacité à voir en l'autre un semblable malgré les différences",["l'appartenance à une même religion","une origine commune","le lieu de naissance"],"La fraternité républicaine est civique : elle ne se fonde ni sur l'origine ni sur la religion."],
[1,7,"Quel exemple illustre la solidarité intergénérationnelle ?","En cotisant, chaque salarié contribue au paiement des retraites",["Payer une amende","Voter aux élections municipales","Déclarer une naissance"],"La solidarité se traduit aussi par le soutien entre les générations."],
[1,8,"Depuis quelle année le 14 juillet est-il la fête nationale ?","1880",["1789","1790","1945"],"Il commémore la prise de la Bastille (1789) et la fête de la Fédération (1790)."],
[1,8,"Que commémore la fête nationale du 14 juillet ?","La prise de la Bastille (1789) et la fête de la Fédération (1790)",["L'armistice de 1918","La fin de la Seconde Guerre mondiale","L'adoption de la Constitution de 1958"],"Le 14 juillet célèbre deux événements : la Bastille en 1789 et la fête de la Fédération un an plus tard."],
[1,8,"Qui a écrit La Marseillaise ?","Rouget de Lisle",["Victor Hugo","Hector Berlioz","Napoléon Bonaparte"],"L'hymne national a été écrit en 1792 par Rouget de Lisle. Il est étudié à l'école primaire."],
[1,8,"En quelle année La Marseillaise a-t-elle été composée ?","1792",["1789","1804","1880"],"Elle a été composée en 1792, pendant la Révolution."],

// ─── état + stockage
const app = document.getElementById('app');

function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
S.len = load('qc_len',20);
let best = load('qc_best',{});

const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function build(pool){
  return pool.map(q=>{
    const opts = shuffle([q[3],...q[4]]);
    return {part:q[0],pg:q[1],q:q[2],opts,good:opts.indexOf(q[3]),e:q[5]};
  });
}

function start(mode, poolOverride){
  let pool;
  if(poolOverride) pool = poolOverride;
  else if(mode==='exam'){
    // examen blanc : 40 questions réparties sur les 5 parties
    pool=[];for(let p=1;p<=5;p++)pool.push(...shuffle(Q.filter(q=>q[0]===p)).slice(0,8));
    pool=shuffle(pool);
  } else {
    const all = shuffle(Q.filter(q=>q[0]===mode));
    pool = S.len==='all'? all : all.slice(0,S.len);
  }
  S.mode=mode; S.quiz=build(pool); S.idx=0; S.answers=new Array(S.quiz.length).fill(null); S.filter='all';
  renderQ(); window.scrollTo(0,0);
}

// ─── question
function modeLabel(){return S.mode==='exam'?'Examen blanc':S.mode==='retry'?'Mes erreurs':'Partie '+ROMAN[S.mode]}
function renderQ(){
  const q=S.quiz[S.idx], n=S.quiz.length, sel=S.answers[S.idx];
  const last = S.idx===n-1;
  app.innerHTML = `
  <div class="bar">
    <div class="bar-row">
      <button class="quit" id="quit">← Quitter</button>
      <span class="count">${modeLabel()} · ${S.idx+1} / ${n}</span>
    </div>
    <div class="progress" aria-hidden="true"><i style="width:${(S.idx/n)*100}%"></i></div>
  </div>
  <article class="qcard">
    <span class="qtag">Partie ${ROMAN[q.part]} · ${PARTS[q.part].s.split(',')[0]}</span>
    <h2 class="qtext" id="qt">${esc(q.q)}</h2>
    <div class="opts" role="radiogroup" aria-labelledby="qt">
      ${q.opts.map((o,i)=>`<button class="opt" role="radio" aria-checked="${sel===i}" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}
    </div>
    <div class="actions">
      ${S.idx>0?`<button class="btn ghost" id="prev">Précédente</button>`:'<span class="hint">Touches 1 à 4 pour répondre, Entrée pour valider</span>'}
      <button class="btn ${last?'blue':''}" id="next" ${sel==null?'disabled':''}>${last?'Voir ma correction':'Question suivante'}</button>
    </div>
  </article>`;
  requestAnimationFrame(()=>{const bar=app.querySelector('.progress i');if(bar)bar.style.width=((S.idx+(sel!=null?1:0))/n*100)+'%'});
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  document.getElementById('next').onclick=next;
  const pv=document.getElementById('prev'); if(pv) pv.onclick=()=>{S.idx--;renderQ()};
  document.getElementById('quit').onclick=renderHome;
}
function pick(i){
  S.answers[S.idx]=i;
  app.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-checked',+b.dataset.i===i));
  document.getElementById('next').disabled=false;
  const bar=app.querySelector('.progress i'); if(bar) bar.style.width=((S.idx+1)/S.quiz.length*100)+'%';
}
function next(){
  if(S.answers[S.idx]==null) return;
  if(S.idx<S.quiz.length-1){S.idx++;renderQ();window.scrollTo({top:0})}
  else {renderResults();window.scrollTo(0,0)}
}
document.addEventListener('keydown',e=>{
  if(!S.quiz || !app.querySelector('.qcard')) return;
  if(['1','2','3','4'].includes(e.key)){const i=+e.key-1;if(i<S.quiz[S.idx].opts.length)pick(i)}
  else if(e.key==='Enter' && !e.target.closest('button')){next()}
});

// ─── résultats + correction
function renderResults(){
  const n=S.quiz.length, ok=S.quiz.filter((q,i)=>S.answers[i]===q.good).length, pct=Math.round(ok/n*100);
  const pass = pct>=80;
  if(S.mode!=='retry'){const k=S.mode;if(best[k]==null||pct>best[k]){best[k]=pct;save('qc_best',best)}}
  addXP(ok*3); bumpStreak();
  const msg = pct===100?"Sans faute ! Tu connais ton livret sur le bout des doigts."
    : pass?"Au-dessus du seuil de 80 %. Repasse en revue tes quelques erreurs."
    : pct>=60?"Tu y es presque. Relis les pages indiquées et retente tes erreurs."
    : "Pas encore. Commence par relire les pages indiquées, puis réessaie.";
  const C=2*Math.PI*62, wrong=n-ok;
  app.innerHTML = `
  <section class="result">
    <div class="ring" role="img" aria-label="${ok} bonnes réponses sur ${n}">
      <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" fill="none" stroke="var(--line)" stroke-width="12"/>
      <circle id="arc" cx="75" cy="75" r="62" fill="none" stroke="${pass?'var(--vert)':'var(--rouge)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1s ease"/></svg>
      <div class="val"><div>${pct} %<small>${ok} / ${n}</small></div></div>
    </div>
    <div class="verdict">
      <span class="eyebrow">${modeLabel()}</span>
      <h2>${pass?'Bravo !':'Continue tes révisions'}</h2>
      <p>${msg} <b style="color:var(--vert)">+${ok*3} XP</b></p>
      <span class="stamp ${pass?'ok':'ko'}">${pass?'Admis·e':'À revoir'}</span>
    </div>
  </section>
  <div class="res-actions">
    ${wrong?`<button class="btn blue" id="retry">Retenter mes ${wrong} erreur${wrong>1?'s':''}</button>`:''}
    <button class="btn ghost" id="again">Nouveau quiz</button>
    <button class="btn ghost" id="home">Accueil</button>
  </div>
  <div class="filter">
    <h2>Correction</h2>
    <button class="chip" data-f="all" aria-pressed="${S.filter==='all'}">Toutes (${n})</button>
    <button class="chip" data-f="wrong" aria-pressed="${S.filter==='wrong'}">Erreurs (${wrong})</button>
    <button class="chip" data-f="good" aria-pressed="${S.filter==='good'}">Réussies (${ok})</button>
  </div>
  <div class="corr" id="corr"></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const a=document.getElementById('arc');if(a)a.style.strokeDashoffset=C*(1-ok/n)}));
  renderCorr();
  app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{S.filter=c.dataset.f;app.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));renderCorr()});
  const r=document.getElementById('retry'); if(r) r.onclick=()=>{
    const pool=S.quiz.filter((q,i)=>S.answers[i]!==q.good).map(q=>Q.find(x=>x[2]===q.q));
    start('retry',shuffle(pool));
  };
  document.getElementById('again').onclick=()=>start(S.mode==='retry'?'exam':S.mode);
  document.getElementById('home').onclick=renderHome;
  if(pass) confetti();
}
function renderCorr(){
  const box=document.getElementById('corr');
  const items=S.quiz.map((q,i)=>({q,i,ok:S.answers[i]===q.good})).filter(x=>S.filter==='all'||(S.filter==='wrong'?!x.ok:x.ok));
  if(!items.length){box.innerHTML=`<p class="empty">${S.filter==='wrong'?'Aucune erreur, bravo !':'Aucune question ici.'}</p>`;return}
  box.innerHTML=items.map(({q,i,ok})=>`
    <div class="ci ${ok?'':'wrong'}">
      <div class="ci-head"><span class="ci-n">${i+1}</span><span class="ci-q">${esc(q.q)}</span></div>
      <div class="ans">
        ${ok?'':`<div class="bad"><b>✗</b><span>Ta réponse : ${esc(q.opts[S.answers[i]])}</span></div>`}
        <div class="good"><b>✓</b><span>${ok?'Bonne réponse : ':'La bonne réponse : '}${esc(q.opts[q.good])}</span></div>
      </div>
      <p class="expl">${esc(q.e)} <span class="pg">Livret p. ${q.pg}</span></p>
    </div>`).join('');
}

// ─── confettis tricolores
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.getElementById('confetti'),ctx=cv.getContext('2d');cv.hidden=false;
  const W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;
  const cols=['#2846b5','#ffffff','#d9303f'];
  const ps=Array.from({length:140},()=>({x:Math.random()*W,y:-Math.random()*H*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:(6+Math.random()*8)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*3)]}));
  let t=0;(function f(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy*devicePixelRatio;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.strokeStyle='rgba(0,0,0,.15)';ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.strokeRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(++t<200)requestAnimationFrame(f);else{ctx.clearRect(0,0,W,H);cv.hidden=true}})();
}

const FLAME = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#e8622c" d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5.2C9.7 10 10.5 11 11.6 11.4 11 8 12 5 12 2z"/><path fill="#f5b83d" d="M12 13c1.2 1.4 2 2.4 2 3.7a2 2 0 0 1-4 0c0-1.2.8-2.3 2-3.7z"/></svg>`;
let xp = load('qc_xp',0), learned = load('qc_learn',{}), streak = load('qc_streak',{last:null,n:0});
const LEVELS=[[0,"Nouvel·le arrivant·e"],[150,"Citoyen·ne en herbe"],[400,"Habitué·e de la mairie"],[800,"Pilier de la République"],[1400,"Expert·e de Marianne"]];
function level(x){let i=0;LEVELS.forEach((l,k)=>{if(x>=l[0])i=k});const nx=LEVELS[i+1];return{name:LEVELS[i][1],i,min:LEVELS[i][0],next:nx?nx[0]:null,nextName:nx?nx[1]:null}}
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return dstr(d)}
function bumpStreak(){const t=dstr(new Date());if(streak.last===t)return;streak.n=streak.last===yesterday()?streak.n+1:1;streak.last=t;save('qc_streak',streak)}
function liveStreak(){return (streak.last===dstr(new Date())||streak.last===yesterday())?streak.n:0}
function addXP(n){xp+=n;save('qc_xp',xp)}
function popXP(t){const el=document.createElement('div');el.className='pop';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),950)}

let L=null;
function startLesson(id){
  const ch=LESSONS.find(l=>l.id===id);
  const pool=shuffle(Q.filter(q=>q[0]===ch.p&&ch.pg.includes(q[1]))).slice(0,3);
  L={ch,deck:ch.c.map((_,i)=>i),pos:0,flipped:false,again:new Set(),first:0,xp:0,lvBefore:level(xp).i,check:build(pool),ci:0,good:0,done:0,phase:'cards'};
  renderCard(); window.scrollTo(0,0);
}
function lessonBar(label,done,total){
  return `<div class="bar"><div class="bar-row"><button class="quit" id="quit">← Parcours</button><span class="count">${label}</span></div>
  <div class="progress" aria-hidden="true"><i style="width:${done/total*100}%"></i></div></div>`;
}
function totalSteps(){return L.ch.c.length+L.check.length}
function renderCard(){
  const c=L.ch.c[L.deck[L.pos]];
  app.innerHTML = lessonBar(`${L.ch.t} · carte ${Math.min(L.ch.c.length,L.done+1)} / ${L.ch.c.length}`, L.done, totalSteps()) + `
  <div class="lesson">
    <div class="flip ${L.flipped?'flipped':''}" id="flip" tabindex="0" role="button" aria-label="Retourner la carte">
      <div class="flip-inner">
        <div class="face front" aria-hidden="${L.flipped}">
          <span class="eyebrow">Partie ${ROMAN[L.ch.p]} · ${L.again.has(L.deck[L.pos])?'à revoir':'question'}</span>
          <p class="prompt">${esc(c[0])}</p>
          <span class="tap">Réfléchis, puis touche la carte pour voir la réponse</span>
        </div>
        <div class="face back" aria-hidden="${!L.flipped}">
          <span class="hook">${esc(c[1])}</span>
          <p>${esc(c[2])}</p>
          ${c[3]?`<div class="tip"><b>Astuce</b>${esc(c[3])}</div>`:''}
        </div>
      </div>
    </div>
    <div class="card-actions" id="ca" ${L.flipped?'':'hidden'}>
      <button class="btn ghost" id="again">À revoir</button>
      <button class="btn blue" id="knew">Je savais !</button>
    </div>
  </div>`;
  const flip=()=>{L.flipped=!L.flipped;const f=document.getElementById('flip');f.classList.toggle('flipped',L.flipped);
    f.querySelector('.front').setAttribute('aria-hidden',L.flipped);f.querySelector('.back').setAttribute('aria-hidden',!L.flipped);
    document.getElementById('ca').hidden=!L.flipped};
  document.getElementById('flip').onclick=flip;
  document.getElementById('flip').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}};
  document.getElementById('knew').onclick=()=>cardDone(true);
  document.getElementById('again').onclick=()=>cardDone(false);
  document.getElementById('quit').onclick=renderHome;
}
function cardDone(knew){
  const idx=L.deck[L.pos];
  if(knew){L.done++;const g=L.again.has(idx)?2:5;if(!L.again.has(idx))L.first++;L.xp+=g;addXP(g);popXP('+'+g+' XP')}
  else{L.again.add(idx);L.deck.push(idx)}
  L.pos++;L.flipped=false;
  if(L.pos<L.deck.length) renderCard();
  else if(L.check.length){L.phase='check';renderCheck()}
  else finishLesson();
  window.scrollTo({top:0});
}
function renderCheck(){
  const q=L.check[L.ci];
  app.innerHTML = lessonBar(`Petit défi · ${L.ci+1} / ${L.check.length}`, L.ch.c.length+L.ci, totalSteps()) + `
  <article class="lcard lesson">
    <span class="qtag">Petit défi · +15 XP par bonne réponse</span>
    <h2 class="qtext" id="qt">${esc(q.q)}</h2>
    <div class="opts" role="radiogroup" aria-labelledby="qt">
      ${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}
    </div>
    <div id="fb"></div>
  </article>`;
  app.querySelectorAll('.lcard .opt').forEach(b=>b.onclick=()=>answerCheck(+b.dataset.i));
  document.getElementById('quit').onclick=renderHome;
}
function answerCheck(i){
  const q=L.check[L.ci]; if(q.done) return; q.done=true;
  const ok=i===q.good;
  app.querySelectorAll('.lcard .opt').forEach(b=>{const k=+b.dataset.i;b.disabled=true;if(k===q.good)b.classList.add('is-good');else if(k===i)b.classList.add('is-bad')});
  if(ok){L.good++;L.xp+=15;addXP(15);popXP('+15 XP')}
  const last=L.ci===L.check.length-1;
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?['Exact !','Bien joué !','Parfait !'][L.ci%3]:'Pas tout à fait.'}</b>${esc(q.e)} <span class="small">Livret p. ${q.pg}</span></div>
    <div class="actions" style="margin-top:14px"><span></span><button class="btn ${last?'blue':''}" id="cnext">${last?'Voir mon résultat':'Continuer'}</button></div>`;
  const nb=document.getElementById('cnext'); nb.focus();
  nb.onclick=()=>{if(last)finishLesson();else{L.ci++;renderCheck();window.scrollTo({top:0})}};
}
function finishLesson(){
  const n=L.ch.c.length, cl=L.check.length;
  const ratio = cl? L.good/cl : L.first/n;
  const stars = ratio===1?3:ratio>=.5?2:1;
  const prev=learned[L.ch.id]||0;
  if(stars>prev){learned[L.ch.id]=stars;save('qc_learn',learned)}
  L.xp+=20; addXP(20); bumpStreak();
  const lv=level(xp), up=lv.i>L.lvBefore;
  const i=LESSONS.indexOf(L.ch), nxt=LESSONS[i+1];
  const pctLv = lv.next? Math.round((xp-lv.min)/(lv.next-lv.min)*100) : 100;
  const title = stars===3?'Impeccable !':stars===2?'Bien joué !':'Chapitre terminé !';
  app.innerHTML = `
  <section class="end">
    <div class="bigstars" role="img" aria-label="${stars} étoile${stars>1?'s':''} sur 3">${[1,2,3].map(k=>`<span class="${k<=stars?'on':''}">★</span>`).join('')}</div>
    <span class="eyebrow">Partie ${ROMAN[L.ch.p]} · ${L.ch.t}</span>
    <h2>${title}</h2>
    ${up?`<div class="levelup">Nouveau niveau : ${lv.name} !</div>`:''}
    <div class="end-stats">
      <div><b>${L.first}/${n}</b><span class="small">cartes sues du 1er coup</span></div>
      ${cl?`<div><b>${L.good}/${cl}</b><span class="small">au petit défi</span></div>`:''}
      <div><b style="color:var(--vert)">+${L.xp}</b><span class="small">XP gagnés</span></div>
      <div><b>${FLAME.replace('<svg','<svg style="width:20px;height:20px;vertical-align:-3px"')} ${liveStreak()}</b><span class="small">jour${liveStreak()>1?'s':''} d'affilée</span></div>
    </div>
    <div class="xpwrap"><div class="xpbar"><i style="width:${pctLv}%"></i></div>
      <span class="small">${lv.name} · ${xp} XP${lv.next?` · encore ${lv.next-xp} XP pour « ${lv.nextName} »`:''}</span></div>
    <div class="res-actions" style="justify-content:center">
      ${nxt?`<button class="btn blue" id="nx">Chapitre suivant : ${esc(nxt.t)} →</button>`:''}
      <button class="btn ghost" id="redo">Recommencer</button>
      <button class="btn ghost" id="tr">M'entraîner sur la partie ${ROMAN[L.ch.p]}</button>
      <button class="btn ghost" id="hm">Parcours</button>
    </div>
  </section>`;
  const ch=L.ch;
  if(nxt) document.getElementById('nx').onclick=()=>startLesson(nxt.id);
  document.getElementById('redo').onclick=()=>startLesson(ch.id);
  document.getElementById('tr').onclick=()=>start(ch.p);
  document.getElementById('hm').onclick=()=>{tab='learn';renderHome();window.scrollTo(0,0)};
  if(stars===3||up) confetti();
}
document.addEventListener('keydown',e=>{
  if(!L||!app.querySelector('.lesson')) return;
  if(L.phase==='cards'&&L.flipped&&!e.target.closest('input')){
    if(e.key==='1'||e.key==='ArrowLeft'){e.preventDefault();cardDone(false)}
    else if(e.key==='2'||e.key==='ArrowRight'){e.preventDefault();cardDone(true)}
  } else if(L.phase==='check'&&['1','2','3','4'].includes(e.key)){answerCheck(+e.key-1)}
});

renderHome();
</script>

</body>
</html>
